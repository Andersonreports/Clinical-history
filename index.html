<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical History Tracker | Anderson Reports</title>
    <link rel="stylesheet" href="style.css?v=1.6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
</head>
<body class="modern-os">
    <div class="app-shell">
        <!-- Main Content (Left) -->
        <main class="app-main">
            <!-- Global Header -->
            <header class="global-header">
                <div class="header-search">
                    <i data-lucide="search"></i>
                    <input type="text" id="main-search" placeholder="Search patient, ID, or clinical details...">
                </div>
                <div class="header-user">
                    <button id="sync-btn" class="btn-sync-pro">
                        <i data-lucide="refresh-cw"></i>
                        <span>Refresh Data</span>
                    </button>
                </div>
            </header>

            <!-- Compact Dashboard Stats -->
            <section class="dashboard-grid">
                <div class="pro-card card-total" id="btn-stat-total">
                    <div class="card-icon-mini"><i data-lucide="database"></i></div>
                    <div class="card-body">
                        <p>Total Records</p>
                        <h2 id="stat-total">0</h2>
                    </div>
                </div>
                <div class="pro-card card-success" id="btn-stat-complete">
                    <div class="card-icon-mini"><i data-lucide="file-check-2"></i></div>
                    <div class="card-body">
                        <p>History Available</p>
                        <h2 id="stat-complete">0</h2>
                    </div>
                </div>
                <div class="pro-card card-danger" id="btn-stat-pending">
                    <div class="card-icon-mini"><i data-lucide="clipboard-list"></i></div>
                    <div class="card-body">
                        <p>History Required</p>
                        <h2 id="stat-pending">0</h2>
                    </div>
                </div>
            </section>

            <!-- Control Bar -->
            <div class="control-bar">
                <div class="pill-filters">
                    <button class="pill active" data-filter="all">All Cases</button>
                    <button class="pill" data-filter="needed">Needs History</button>
                    <button class="pill" data-filter="available">Completed</button>
                </div>
                <select id="test-filter" class="select-pro">
                    <option value="all">All Test Categories</option>
                </select>
            </div>

            <!-- Data Surface -->
            <div class="data-surface">
                <div class="surface-table-container">
                    <table class="pro-table">
                        <thead>
                            <tr>
                                <th>Patient Identity</th>
                                <th>Anderson ID</th>
                                <th>Test Information</th>
                                <th>Month</th>
                                <th>Clinical Status</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="grid-body">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>
                
                <div class="surface-footer">
                    <span id="pagination-info">Showing 0 cases</span>
                    <div id="pagination" class="pagination-pro"></div>
                </div>
            </div>
        </main>

        <!-- Sidebar Navigation (Right) -->
        <aside class="app-sidebar right-aligned">
            <div class="sidebar-brand">
                <i data-lucide="dna"></i>
                <span>Clinical OS</span>
            </div>
            <nav class="month-nav" id="sidebar-months">
                <div class="nav-label">Global View</div>
                <!-- Month links injected here -->
            </nav>
        </aside>

        <!-- Professional Case Panel -->
        <div id="side-panel" class="pro-panel">
            <div class="panel-blur"></div>
            <div class="panel-content">
                <header class="panel-header">
                    <button id="close-panel" class="btn-back"><i data-lucide="arrow-left"></i> <span>Close Panel</span></button>
                    <div class="panel-actions">
                        <button id="copy-btn" class="btn-action-pro"><i data-lucide="copy"></i> Copy Writeup</button>
                    </div>
                </header>

                <div class="panel-body">
                    <section class="case-header">
                        <h2 id="d-name">Patient Name</h2>
                        <div class="case-meta">
                            <span id="d-id" class="id-token">AND000</span>
                            <span id="d-month" class="month-token">JUL 2025</span>
                        </div>
                    </section>

                    <section class="case-details-enhanced">
                        <div class="detail-row">
                            <div class="detail-item">
                                <label><i data-lucide="microscope"></i> Test Information</label>
                                <p id="d-test">-</p>
                            </div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-item">
                                <label><i data-lucide="building"></i> Client Reference</label>
                                <p id="d-client">-</p>
                            </div>
                        </div>
                        
                        <div class="detail-row-special trf-section">
                            <label><i data-lucide="file-text"></i> TRF & Reporting Status</label>
                            <div id="d-trf" class="trf-content-box">-</div>
                        </div>

                        <div class="detail-row-special history-section">
                            <div class="label-with-action">
                                <label><i data-lucide="align-left"></i> Clinical History Writeup</label>
                            </div>
                            <div id="d-history" class="history-content-box">-</div>
                        </div>

                        <div class="detail-row-special remarks-section">
                            <label><i data-lucide="message-circle"></i> Registry Remarks</label>
                            <p id="d-remark" class="remark-content">-</p>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <div id="panel-overlay" class="panel-overlay"></div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js?v=1.6"></script>
</body>
</html>
