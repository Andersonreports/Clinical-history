<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical History Tracker | Anderson Reports</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
</head>
<body class="grid-workspace">
    <div class="app-container">
        <!-- Top Toolbar -->
        <header class="app-toolbar">
            <div class="toolbar-left">
                <h1 class="app-title">Clinical History Tracker</h1>
                <div class="app-stats">
                    <div class="stat-item"><span class="val" id="stat-total">0</span> <span class="lbl">Total</span></div>
                    <div class="stat-item success"><span class="val" id="stat-complete">0</span> <span class="lbl">History OK</span></div>
                    <div class="stat-item error"><span class="val" id="stat-pending">0</span> <span class="lbl">Missing</span></div>
                </div>
            </div>
            <div class="toolbar-right">
                <button id="sync-btn" class="btn btn-primary">
                    <i data-lucide="refresh-cw"></i>
                    <span>Sync Live Data</span>
                </button>
            </div>
        </header>

        <!-- Filter Bar -->
        <section class="filter-bar">
            <div class="search-group">
                <i data-lucide="search"></i>
                <input type="text" id="main-search" placeholder="Quick search patient, ID, or test...">
            </div>
            <div class="filter-group">
                <select id="month-filter">
                    <option value="all">All Months</option>
                </select>
                <select id="status-filter">
                    <option value="all">All Status</option>
                    <option value="needed">History Missing</option>
                    <option value="available">History Available</option>
                </select>
                <select id="test-filter" style="max-width: 200px;">
                    <option value="all">All Test Types</option>
                </select>
            </div>
        </section>

        <!-- Main Data Grid -->
        <main class="grid-main">
            <div class="table-scroll">
                <table id="main-grid">
                    <thead>
                        <tr>
                            <th style="width: 250px;">Patient Name</th>
                            <th style="width: 150px;">Anderson ID</th>
                            <th style="width: 180px;">Test Type</th>
                            <th style="width: 120px;">Month</th>
                            <th style="width: 140px;">Status</th>
                            <th style="width: 80px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="grid-body">
                        <!-- Data rows -->
                    </tbody>
                </table>
            </div>
            
            <div class="grid-footer">
                <div class="pagination-info" id="pagination-info">Showing 0-0 of 0</div>
                <div class="pagination-controls" id="pagination">
                    <!-- Pagination buttons -->
                </div>
            </div>
        </main>

        <!-- Detail Side Panel (Overlay) -->
        <div id="side-panel" class="side-panel">
            <div class="panel-header">
                <h2>Case Details</h2>
                <button id="close-panel" class="btn-icon"><i data-lucide="x"></i></button>
            </div>
            <div class="panel-body">
                <div class="detail-section patient-card">
                    <h3 id="d-name">Patient Name</h3>
                    <span id="d-id" class="id-tag">AND000</span>
                </div>

                <div class="detail-section">
                    <div class="detail-grid">
                        <div class="d-item"><label>Test</label><p id="d-test">-</p></div>
                        <div class="d-item"><label>Month</label><p id="d-month">-</p></div>
                        <div class="d-item full"><label>Client</label><p id="d-client">-</p></div>
                    </div>
                </div>

                <div class="detail-section trf-section">
                    <label>TRF & Reports Status</label>
                    <div id="d-trf" class="trf-status-box">-</div>
                </div>

                <div class="detail-section history-section">
                    <div class="label-row">
                        <label>Clinical History Writeup</label>
                        <button id="copy-btn" class="btn btn-sm">Copy</button>
                    </div>
                    <div id="d-history" class="history-display">-</div>
                </div>

                <div class="detail-section">
                    <label>Registry Remarks</label>
                    <p id="d-remark" class="remark-text">-</p>
                </div>
            </div>
        </div>
        <div id="panel-overlay" class="panel-overlay"></div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js?v=1.2"></script>
</body>
</html>
